---
- name: Install PostgreSQL server and client libraries
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL user for NexGrad
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ db_username | default('nexgrad_user') }}"
    password: "{{ db_password | default('nexgrad_secure_pass_2026') }}"
    state: present
  ignore_errors: true

- name: Create PostgreSQL database for NexGrad
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ db_name | default('nexgrad') }}"
    owner: "{{ db_username | default('nexgrad_user') }}"
    state: present
  ignore_errors: true

- name: Enforce PostgreSQL listening strictly on localhost
  ansible.builtin.shell: |
    sed -i "s/^#\?listen_addresses\s*=.*/listen_addresses = 'localhost'/" /etc/postgresql/*/main/postgresql.conf
  changed_when: false
  notify: Restart PostgreSQL

- name: Create Django application directory
  ansible.builtin.file:
    path: "{{ django_app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Synchronize Django source code
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../backend/"
    dest: "{{ django_app_dir }}/"
    archive: true
    delete: false

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: "{{ python_executable }} -m venv {{ django_venv }}"
    creates: "{{ django_venv }}/bin/activate"

- name: Install Django dependencies
  ansible.builtin.pip:
    requirements: "{{ django_app_dir }}/requirements.txt"
    virtualenv: "{{ django_venv }}"

- name: Create Gemini environment file
  ansible.builtin.file:
    path: "{{ gemini_secret_path }}"
    state: touch
    owner: root
    group: "{{ app_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Configure Django systemd service
  ansible.builtin.template:
    src: nexgrad-backend.service.j2
    dest: /etc/systemd/system/nexgrad-backend.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Django backend

- name: Enable Django backend service
  ansible.builtin.systemd:
    name: "{{ django_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
