---
- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - python3
      - python3-pip
      - python3-venv
      - rsync
      - htop
      - ufw
    state: present

- name: Create NexGrad group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create NexGrad user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ log_dir }}"
    - /etc/nexgrad
