---
project_name: nexgrad

app_user: nexgrad
app_group: nexgrad

app_dir: /opt/nexgrad
log_dir: /var/log/nexgrad

python_executable: /usr/bin/python3

django_app_dir: /opt/nexgrad/backend
django_venv: /opt/nexgrad/venv

django_service_name: nexgrad-backend
django_wsgi_module: nexgrad.wsgi:application

frontend_root: /var/www/nexgrad

gemini_secret_path: /etc/nexgrad/nexgrad.env

backend_port: 8000
frontend_port: 80

nginx_service_name: nginx
