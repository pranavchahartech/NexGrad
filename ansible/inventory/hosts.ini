# ==============================================================================
# NexGrad Ansible Inventory (AWS SSM SSH Tunnel Architecture)
# Replace instance ID placeholders with outputs from 'terraform apply'
# e.g.:
#   frontend ansible_host=i-0123456789abcdef0
#   backend  ansible_host=i-0987654321fedcba0
# ==============================================================================

[production_web]
frontend ansible_host=i-FRONTEND_INSTANCE_ID

[production_app]
backend ansible_host=i-BACKEND_INSTANCE_ID

[management]
localhost ansible_connection=local

[production:children]
production_web
production_app
management

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
