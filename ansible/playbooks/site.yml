---
- name: Configure common packages and users
  hosts: production
  become: true
  roles:
    - common

- name: Configure NexGrad frontend
  hosts: production_web
  become: true
  roles:
    - frontend

- name: Configure NexGrad Django backend
  hosts: production_app
  become: true
  roles:
    - backend

- name: Configure DevOps management server
  hosts: management
  become: true
  roles:
    - monitoring
    - puppet_server
