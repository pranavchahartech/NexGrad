# ==============================================================================
# Nagios Core Configuration for NexGrad Self-Healing Platform
# ==============================================================================

log_file=/var/log/nagios/nagios.log
cfg_file=/etc/nagios/configurations/commands.cfg
cfg_file=/etc/nagios/configurations/contacts.cfg
cfg_file=/etc/nagios/configurations/hosts.cfg
cfg_file=/etc/nagios/configurations/services.cfg

# Enable Active Checks and Event Handlers (Critical for Self-Healing)
execute_service_checks=1
accept_passive_service_checks=1
enable_event_handlers=1
check_external_commands=1

# Intervals and timeouts
interval_length=60
service_check_timeout=60
host_check_timeout=30
event_handler_timeout=30
notification_timeout=30

