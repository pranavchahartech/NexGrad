# Backend Service Monitoring + Self-Healing Trigger + Alerts
define service {
    use                     generic-service
    host_name               nexgrad-app01
    service_description     Django_Backend_HTTP_Health
    check_command           check_django_health!8000!/healthz
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          nexgrad_ops
    event_handler           handle_backend_failure
}

# AI Microservice Monitoring + Self-Healing Trigger + Alerts
define service {
    use                     generic-service
    host_name               nexgrad-ai01
    service_description     AI_Microservice_Health
    check_command           check_ai_service!8001!/health
    max_check_attempts      2
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          nexgrad_ops
    event_handler           handle_ai_failure
}

# PostgreSQL Database Connectivity Check + Alerts
define service {
    use                     generic-service
    host_name               nexgrad-app01
    service_description     Postgres_Database_Connectivity
    check_command           check_db_connectivity
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          nexgrad_ops
}
