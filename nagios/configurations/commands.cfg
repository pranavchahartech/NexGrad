# ==============================================================================
# Nagios Custom Commands, Event Handlers & Email Notification Commands
# ==============================================================================

# Service Check Commands
define command {
    command_name    check_django_health
    command_line    $USER1$/check_django_health.py -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$
}

define command {
    command_name    check_ai_service
    command_line    $USER1$/check_ai_service.py -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$
}

define command {
    command_name    check_db_connectivity
    command_line    $USER1$/check_db_connectivity.py -H $HOSTADDRESS$
}

# Self-Healing Event Handler Commands
define command {
    command_name    handle_backend_failure
    command_line    /etc/nagios/event-handlers/handle_backend_failure.sh $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$ $HOSTADDRESS$
}

define command {
    command_name    handle_ai_failure
    command_line    /etc/nagios/event-handlers/handle_ai_failure.sh $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$ $HOSTADDRESS$
}

# Email Alert Notification Commands for karthiksn20112004@gmail.com
define command {
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** NexGrad Infrastructure Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Host Alert: $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}

define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** NexGrad Service Alert *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}
