name: AI Service Intelligence & Microservice Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ai-service/**'

jobs:
  test-ai-intelligence:
    name: Test Intent Classification & Conversational State
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai-service/requirements.txt

      - name: Run AI Assistant Automated Test Suite (30 Unit Tests)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          python manage.py test ai_assistant

  build-and-deploy-ai:
    name: Containerize AI Microservice
    needs: test-ai-intelligence
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build AI Service Container
        run: |
          docker build -t nexgrad-ai-service:latest ./ai-service
          echo "AI Service container validated and built."

