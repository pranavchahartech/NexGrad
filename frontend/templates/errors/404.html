{% extends 'base.html' %}

{% block title %}404 — Page Not Found | Nexgrad{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="display-1 fw-bold" style="color: var(--slate);">404</div>
  <h2 class="fw-bold mb-3" style="color: var(--navy);">Page Not Found</h2>
  <p class="text-muted max-w-500 mx-auto mb-4">
    The engineering opportunity, candidate portfolio, or assessment endpoint you requested does not exist or may have been relocated.
  </p>
  <a href="{% url 'core:home' %}" class="btn btn-nex-primary">
    <i class="bi bi-house-door me-1"></i> Return to Homepage
  </a>
</div>
{% endblock %}
